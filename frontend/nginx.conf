server {
    listen 80;
    server_name _;
    server_tokens off;
    # Request dari Cloudflare Tunnel masuk lewat cloudflared di VM ke 127.0.0.1:8090, lalu diteruskan Docker
    # dari gateway network doomsday. Header CF-Connecting-IP hanya dipercaya dari gateway itu. Request LAN
    # datang dengan IP aslinya, jadi header palsu dari LAN diabaikan. Harus sama dengan gateway di docker-compose.yml.
    set_real_ip_from 172.30.93.1;
    real_ip_header CF-Connecting-IP;
    root /usr/share/nginx/html;
    index index.html;

    # Body terbesar adalah registrasi VIP 4 orang, jauh di bawah batas ini.
    client_max_body_size 16k;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hanya ditulis di level server. Location yang memakai add_header sendiri tidak lagi mewarisi
    # header ini, jadi cache di bawah diatur dengan expires.
    # unsafe-inline di style-src dan data:/blob: di img-src dibutuhkan html-to-image untuk PNG kartu akses.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # DNS Docker. Dengan variabel, nama backend di-resolve ulang, jadi Nginx tidak terus mengirim ke IP
    # lama setelah backend di-build ulang, dan tetap bisa start walaupun backend belum nyala.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://doomsday-backend:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Ditimpa, bukan ditambah. Dengan $proxy_add_x_forwarded_for, klien bisa mengirim IP palsu
        # dan rate limit di backend membaca IP itu.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Nama file dari Vite berisi hash. File yang tidak ada dijawab 404, bukan index.html,
    # supaya tidak muncul bentol MIME saat browser mencari bundle lama.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location ~ ^/(fonts|brand)/ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
